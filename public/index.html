<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Sikkerhetsdemo</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            color: #ff3333;
            margin-bottom: 20px;
        }

        .image {
            width: 300px;
            max-width: 80%;
            margin: 30px 0;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
        }

        p {
            font-size: 22px;
            margin: 5px;
        }

        #counter {
            font-size: 50px;
            font-weight: bold;
            color: #00ff99;
            margin-bottom: 15px;
        }

        #device, #time {
            font-size: 18px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <h1>Nå kunne du vært hacket</h1>

    <!-- BILDE -->
    <img src="hacker.png" alt="Hacker bilde" class="image">

    <p>Antall besøkende:</p>
    <div id="counter">0</div>

    <p id="device"></p>
    <p id="time"></p>

    <script>
        // ===== TELLER =====
        fetch("/count")
            .then(res => res.json())
            .then(data => {
                document.getElementById("counter").innerText = data.count;
            });

        setInterval(() => {
            fetch("/current")
                .then(res => res.json())
                .then(data => {
                    document.getElementById("counter").innerText = data.count;
                });
        }, 2000);


        // ===== DEVICE DETEKSJON =====
        const ua = navigator.userAgent;
        let device = "Ukjent enhet";

        if (ua.includes("Windows")) device = "Windows PC";
        else if (ua.includes("Mac")) device = "Mac";
        else if (ua.includes("iPhone")) device = "iPhone";
        else if (ua.includes("Android")) device = "Android";
        else if (ua.includes("iPad")) device = "iPad";

        document.getElementById("device").innerText =
            "Din enhet: " + device;


        // ===== TIDSPUNKT =====
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString("no-NO");
            document.getElementById("time").innerText =
                "Tidspunkt: " + timeString;
        }

        updateTime();
        setInterval(updateTime, 1000);

    </script>

</body>
</html>
