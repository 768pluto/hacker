<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Sikkerhetsdemo</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            color: #ff3333;
            margin-bottom: 20px;
        }

        .image {
            width: 300px;
            max-width: 80%;
            margin: 30px 0;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
        }

        p {
            font-size: 22px;
            margin: 5px;
        }

        #counter {
            font-size: 50px;
            font-weight: bold;
            color: #00ff99;
            margin-bottom: 15px;
        }

        #device, #time {
            font-size: 18px;
            color: #ccc;
        }

        .info {
            max-width: 700px;
            font-size: 20px;
            color: #ddd;
            line-height: 1.5;
            margin-top: 30px;
        }

        a {
            color: #00ff99;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Nå kunne du vært hacket</h1>

    <!-- BILDE -->
    <img src="hacker.png" alt="Hacker bilde" class="image">

    <p>Antall besøkende:</p>
    <div id="counter">0</div>

    <p id="device"></p>
    <p id="time"></p>

    <!-- NY TEKST -->
    <p class="info">
        Vi anbefaler at du kommer til Canon Business Center VT sitt seminar 12. oktober.<br>
        Da kan du lære mer om hvordan unngå å bli hacket.<br><br>
        Link (trygg) til påmelding:<br>
        <a href="https://www.xxxxxxx/cccc.com" target="_blank">
            www.xxxxxxx/cccc.com
        </a>
    </p>

    <script>
        // ===== TELLER =====
        fetch("/count")
            .then(res => res.json())
            .then(data => {
                document.getElementById("counter").innerText = data.count;
            });

        setInterval(() => {
            fetch("/current")
                .then(res => res.json())
                .then(data => {
                    document.getElementById("counter").innerText = data.count;
                });
        }, 2000);

        // ===== OPERATIVSYSTEM =====
        const ua = navigator.userAgent;
        let device = "Ukjent enhet";

        if (/iPhone/.test(ua)) device = "iOS (iPhone)";
        else if (/iPad/.test(ua)) device = "iOS (iPad)";
        else if (/Android/.test(ua)) device = "Android";
        else if (/Windows/.test(ua)) device = "Windows";
        else if (/Macintosh/.test(ua)) device = "macOS";

        document.getElementById("device").innerText =
            "Operativsystem: " + device;

        // ===== TIDSPUNKT =====
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString("no-NO");
            document.getElementById("time").innerText =
                "Tidspunkt: " + timeString;
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
